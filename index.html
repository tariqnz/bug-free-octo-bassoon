<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header class="app-header">
            <div class="logo-container">
                <!-- SVG Logo will be inserted here by script.js or directly if static -->
                <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="36" height="36">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                </svg>
            </div>
            <h1>My Modern To-Do List</h1>
        </header>

        <main>
            <section id="input-area">
                <h2>Add New Task</h2>
                <form id="add-task-form">
                    <div class="form-group">
                        <label for="task-title">Title:</label>
                        <input type="text" id="task-title" name="task-title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description:</label>
                        <textarea id="task-description" name="task-description" rows="3"></textarea>
                    </div>
                    <div class="form-group form-row">
                        <div class="form-group-half">
                            <label for="task-due-date">Due Date:</label>
                            <input type="date" id="task-due-date" name="task-due-date">
                        </div>
                        <div class="form-group-half">
                            <label for="task-due-time">Due Time:</label>
                            <input type="time" id="task-due-time" name="task-due-time">
                        </div>
                    </div>
                    <button type="submit" id="add-task-btn">Add Task</button>
                </form>
            </section>

            <section id="task-display-area">
                <h2>Tasks</h2>
                <div id="task-list-container">
                    <!-- Tasks will be dynamically added here by JavaScript -->
                    <ul id="task-list"></ul>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2023 Modern To-Do App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
